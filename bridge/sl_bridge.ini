; sl1_bridge.ini - configuration for the Streamline 1.3.3 -> 2.14.16 bridge
; Place next to sl.interposer.dll (the bridge). Restart the game after editing.
;
; LogLevel        0 = errors only, 1 = state changes (default), 2 = every API call
; PluginDir       sub-directory (relative to this DLL) holding the genuine SL2 stack
; LogDir          sub-directory for SL2's own sl.log (and NGX logs)
; ForceMode       -1 = use what the game asks, else DLSS-G mode: 0 off, 1 on, 2 auto, 3 dynamic
; ForceNumFrames  -1 = use what the game asks, else 1..5 frames to generate (2x..6x)
; ForceDynamicFPS  >0 target FPS for dynamic MFG (0 = auto detect refresh rate)
; ForceFlags      -1 = default, else raw sl::DLSSGFlags bitmask
; EnableUIRecomposition  1 = use the tagged UI buffer for frame generation (recommended)
; ForwardReflex   1 = translate the game's Reflex constants to the SL2 reflex plugin
; BypassOSVersionCheck   1 = set SL2's eBypassOSVersionCheck (only if features are blocked by OS check)
; DXGIFactoryProxy       1 = SL2 uses a DXGI factory proxy instead of patching the v-table
;                            (compatible with injected overlays such as ReShade; recommended)
; CanonicalViewport      1 = collapse every viewport id onto viewport 0 (single-view game)
; HostSDK        host SDK version reported to SL 2:
;                  "1.5.0" (default) = what NVIDIA's interposer redirection reports for
;                  legacy SL1 titles; enables automatic device registration + early
;                  feature-function lookup. "sdk" = SL2 SDK version of the build headers,
;                  "file" = version of sl2\sl.interposer.dll, or an explicit "x.y.z".
; LogPerProcess  1 = SL2 writes sl2logs\<pid>\sl.log so two game instances cannot
;                  collide on the same log file (the direct-launch path boots twice)
; LoggedOnceKeys  internal, leave alone
;
; AppId          -1 = relay the application id the game passes to slInit, >= 0 = force
;                       this value. If the effective id is 0 the bridge substitutes a
;                       non-zero stand-in (SL2 production builds disable NGX for id 0:
;                       "Please provide correct application id when calling slInit").
; ProjectId      non-empty = report it as projectId; SL2 then initialises NGX through
;                       Init_with_ProjectID and skips the application-id check entirely.
;                       "0" or empty = use the application-id path instead.

[bridge]
LogLevel=2
PluginDir=sl2
LogDir=sl2logs
ForceMode=1
ForceNumFrames=4
ForceDynamicFPS=0
ForceFlags=-1
EnableUIRecomposition=1
ForwardReflex=1
; ForceReflexMode -1 = use what the game asks, else 0 off / 1 low latency / 2 low latency + boost
ForceReflexMode=-1
; AutoReflexWithFG  1 = if the game enables frame generation but left Reflex off, switch Reflex on
;                       (DLSS-G refuses to run without it)
AutoReflexWithFG=1
BypassOSVersionCheck=0
CanonicalViewport=1
DXGIFactoryProxy=1
HostSDK=1.5.0
LogPerProcess=1
AppId=-1
ProjectId=0
